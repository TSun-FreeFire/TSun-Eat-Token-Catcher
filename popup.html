<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      padding: 18px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f1a;
      color: #fff;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 16px; font-weight: 700; }
    .version { font-size: 11px; color: #666; background: #1a1a2e; padding: 2px 8px; border-radius: 4px; }
    .provider-title {
      font-size: 12px;
      color: #aaa;
      margin: 0 0 12px 0;
      text-align: center;
    }
    .providers {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .provider-btn {
      background: transparent;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 6px;
      cursor: pointer;
      width: 56px;
      height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .provider-btn:hover {
      border-color: #fff;
      transform: scale(1.05);
    }
    .provider-btn img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      pointer-events: none;
    }
    .panel {
      background: #121220;
      border: 1px solid #2d2d44;
      border-radius: 12px;
      padding: 16px;
    }
    .status-waiting {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 10px 0;
    }
    .captured-at {
      font-size: 11px;
      color: #666;
      margin-bottom: 12px;
      text-align: right;
    }
    .row {
      background: #0f0f1a;
      border: 1px solid #1f1f33;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .row .label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .row .value {
      font-size: 14px;
      word-break: break-all;
      font-family: monospace;
      color: #4caf50;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid #444;
      color: #888;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .copy-btn:hover { border-color: #666; color: #fff; }
    .copy-btn.copied { border-color: #4caf50; color: #4caf50; }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>EAT Token Catcher</h1>
    <span class="version">v1.0.2</span>
  </div>

  <p class="provider-title">Select Provider &amp; Login</p>
  <div class="providers">
    <button class="provider-btn" data-url="https://auth.garena.com/universal/oauth?platform=8&response_type=code&locale=en-SG&client_id=100067&redirect_uri=https://api.ff.garena.co.id/auth/auth/callback_n?site=https://api-discountstore.gid.recargajogo.com.br/oauth/callback_redirect/" type="button">
      <img src="https://raw.githubusercontent.com/KillerSharmaBot/Eat-Token/refs/heads/main/image/Google.png" alt="Google" />
    </button>
    <button class="provider-btn" data-url="https://auth.garena.com/universal/oauth?platform=3&response_type=code&locale=en-SG&client_id=100067&redirect_uri=https://api.ff.garena.co.id/auth/auth/callback_n?site=https://api-discountstore.gid.recargajogo.com.br/oauth/callback_redirect/" type="button">
      <img src="https://raw.githubusercontent.com/KillerSharmaBot/Eat-Token/refs/heads/main/image/Facebook.png" alt="Facebook" />
    </button>
    <button class="provider-btn" data-url="https://auth.garena.com/universal/oauth?platform=10&response_type=code&locale=en-SG&client_id=100067&redirect_uri=https://api.ff.garena.co.id/auth/auth/callback_n?site=https://api-discountstore.gid.recargajogo.com.br/oauth/callback_redirect/" type="button">
      <img src="\socail-icons\apple.png" alt="Apple" />
    </button>
    <button class="provider-btn" data-url="https://auth.garena.com/universal/oauth?platform=11&response_type=code&locale=en-SG&client_id=100067&redirect_uri=https://api.ff.garena.co.id/auth/auth/callback_n?site=https://api-discountstore.gid.recargajogo.com.br/oauth/callback_redirect/" type="button">
      <img src="https://raw.githubusercontent.com/KillerSharmaBot/Eat-Token/refs/heads/main/image/X.png" alt="X" />
    </button>
    <button class="provider-btn" data-url="https://auth.garena.com/universal/oauth?platform=5&response_type=code&locale=en-SG&client_id=100067&redirect_uri=https://api.ff.garena.co.id/auth/auth/callback_n?site=https://api-discountstore.gid.recargajogo.com.br/oauth/callback_redirect/" type="button">
      <img src="https://raw.githubusercontent.com/KillerSharmaBot/Eat-Token/refs/heads/main/image/VK.png" alt="VK" />
    </button>
  </div>

  <div class="panel">
    <div id="noData" class="status-waiting">
      No data captured yet.<br>Select a provider to login.
    </div>

    <div id="dataPanel" style="display:none">
      <div id="capturedAt" class="captured-at"></div>

      <div class="row">
        <div class="label">EAT <button id="copy-eat" class="copy-btn" type="button">Copy</button></div>
        <div class="value" id="val-eat"></div>
      </div>

      <div class="row">
        <div class="label">Region <button id="copy-region" class="copy-btn" type="button">Copy</button></div>
        <div class="value" id="val-region"></div>
      </div>

      <div class="row">
        <div class="label">Account ID <button id="copy-account" class="copy-btn" type="button">Copy</button></div>
        <div class="value" id="val-account"></div>
      </div>

      <div class="row">
        <div class="label">Nickname <button id="copy-nickname" class="copy-btn" type="button">Copy</button></div>
        <div class="value" id="val-nickname"></div>
      </div>
    </div>
  </div>

  <div class="footer">Detects discstore.recargajogo.com.br</div>
  <script src="popup.js"></script>
</body>
</html>
